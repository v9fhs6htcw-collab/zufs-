<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZUFS Racing Team – Hub</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2433;--mut:#6b7788;--bd:#e4e7ec;--ac:#c98a10;--pr:#12233a;--prt:#fff;--ok:#2f7d57;--okb:#e7f3ec;--bad:#b4403c;--badb:#f8eceb;--gl:#fbf3e0;--gt:#8a5d00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1520;--card:#142030;--tx:#e8edf4;--mut:#93a1b5;--bd:#243348;--ac:#e0a02a;--pr:#e0a02a;--prt:#12233a;--ok:#5fbf8f;--okb:#17332a;--bad:#e07b76;--badb:#3a1f20;--gl:#33290f;--gt:#e0a02a}}
:root[data-theme="dark"]{--bg:#0d1520;--card:#142030;--tx:#e8edf4;--mut:#93a1b5;--bd:#243348;--ac:#e0a02a;--pr:#e0a02a;--prt:#12233a;--ok:#5fbf8f;--okb:#17332a;--bad:#e07b76;--badb:#3a1f20;--gl:#33290f;--gt:#e0a02a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
header{background:#0f2435;border-bottom:2px solid var(--ac);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.br{display:flex;align-items:center;gap:12px}.br img{height:54px;width:auto;display:block}
header h1{margin:0;font-size:15px;font-weight:700;color:#fff;letter-spacing:1.5px}
header p{margin:2px 0 0;color:#9fb0c6;font-size:11px;letter-spacing:.3px}
.sv{font-size:11px;color:#9fb0c6;white-space:nowrap}
main{padding:16px 12px 92px;max-width:780px;margin:auto}
h2{margin:2px 0 14px;font-size:19px;font-weight:650}h3{margin:20px 0 8px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nw{flex-wrap:nowrap}.sp{justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:650}.stat span{font-size:12px;color:var(--mut)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
.mut{color:var(--mut);font-size:12px}.b{font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--bd);color:var(--mut)}
.tag.l{background:var(--gl);color:var(--gt);font-weight:600}.tag.r{background:var(--badb);color:var(--bad);font-weight:600}.tag.f{background:var(--okb);color:var(--ok);font-weight:600}
.btn{border:0;background:var(--pr);color:var(--prt);padding:9px 16px;border-radius:6px;font:inherit;font-size:13px;font-weight:600}
.btn.s{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.sm{padding:6px 12px;font-size:12px}
.bar{height:5px;border-radius:3px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.d{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}.d.ok{background:var(--ok);opacity:.8}.d.no{background:var(--bd)}
.gb,.rb{flex:1;border:1px solid var(--bd);border-radius:6px;padding:7px;font:inherit;font-size:12px;background:transparent;color:var(--mut);font-weight:500}
.gb.on{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:600}
.rb.on{background:var(--badb);border-color:var(--bad);color:var(--bad);font-weight:600}
.chk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.chk:last-child{border-bottom:0}.chk input{width:18px;height:18px;flex:none;accent-color:var(--pr)}
input[type=checkbox]{accent-color:var(--pr)}
.st{font-size:18px;color:var(--bd);cursor:pointer}.st.on{color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mut);padding:7px 13px;border-radius:6px;font:inherit;font-size:13px}
.chip.on{background:var(--pr);border-color:var(--pr);color:var(--prt);font-weight:600}
.av{width:40px;height:40px;border-radius:50%;background:#12233a;color:#e0a02a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.lead{border-left:3px solid var(--ac)}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
.nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 7px;font:inherit;font-size:11px}.nav svg{display:block;margin:0 auto 3px;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--tx);font-weight:600;box-shadow:inset 0 2px 0 var(--ac)}
.mod{position:fixed;inset:0;background:rgba(10,18,28,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mod .card{width:100%;max-width:420px}
.pj{cursor:pointer;border-left:3px solid var(--ac)}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--bd)}.lg{font-size:13px;padding:8px 0;border-bottom:1px solid var(--bd)}.lg:last-child{border-bottom:0}
.tk{padding:10px 0;border-bottom:1px solid var(--bd)}.tk:last-of-type{border-bottom:0}
</style>
</head>

function leadCard(t){var ms=tm(t),L=ms.filter(function(m){return m.L})[0],mb=ms.filter(function(m){return!m.L}),ids=mb.map(function(m){return m.id}),ts=D.tasks.filter(function(k){return ids.indexOf(k.m)>-1}),d=ts.filter(function(k){return k.done}).length;
 return '<div class="card lead"><div class="row nw"><div class="av">'+(L?e(ini(L.n)):"?")+'</div><div style="flex:1"><div class="mut">'+e(t)+' · Team Leader</div><div class="b" style="font-size:17px">'+(L?e(L.n):"Not assigned")+'</div>'+(L?'<div class="mut"><a href="mailto:'+e(L.e)+'">'+e(L.e)+'</a> · '+e(L.p)+'</div>':'')+'</div></div><div class="row sp" style="margin-top:10px"><span class="mut">'+mb.length+' members</span>'+(U.tab==="tasks"?'<span class="mut">'+d+'/'+ts.length+' tasks done</span>':'')+'</div>'+(U.tab==="tasks"?bar(ts.length?Math.round(d*100/ts.length):0):'')+'</div>'}
var V={

 var all=D.members,bl=all.filter(function(m){return m.st==="bl"}),st=all.filter(function(m){return m.st==="star"});
 var done=D.tasks.filter(function(t){return t.done}).length,tp=D.tasks.length?Math.round(done*100/D.tasks.length):0;

 h+='<h3>Attendance by team</h3><div class="card">'+TR.map(function(t){var s=tm(t).map(pct).filter(function(x){return x!==null}),a=s.length?Math.round(s.reduce(function(x,y){return x+y},0)/s.length):0;return '<div style="margin:8px 0"><div class="row sp"><span>'+e(t)+'</span><span class="mut">'+(s.length?a+"%":"No sessions")+'</span></div>'+bar(a)+'</div>'}).join("")+'</div>';
 h+='<h3>Blacklist</h3><div class="card">'+(bl.length?bl.map(function(m){return '<div class="chk"><div style="flex:1"><span class="b">'+e(m.n)+'</span> <span class="tag">'+e(m.t)+'</span><div class="mut">3 warnings reached</div></div><button class="btn sm s" onclick="mail(\''+m.id+'\')">Resend email</button></div>'}).join(""):'<span class="mut">Nobody at the moment</span>')+'</div>';
 var wn=all.filter(function(m){return m.w>0&&m.st!=="bl"});h+='<h3>Active warnings</h3><div class="card">'+(wn.length?wn.map(function(m){return '<div class="chk"><div style="flex:1"><span class="b">'+e(m.n)+'</span> <span class="tag">'+e(m.t)+'</span></div><span class="tag r">'+m.w+'/3</span></div>'}).join(""):'<span class="mut">No active warnings</span>')+'</div>';h+='<h3>Featured members</h3><div class="card">'+(st.length?st.map(function(m){return '<div class="chk"><span class="b" style="flex:1">'+e(m.n)+'</span><span class="tag">'+e(m.t)+'</span></div>'}).join(""):'<span class="mut">Nobody at the moment</span>')+'</div>';
 h+='<h3>Projects</h3><div class="card">'+D.projects.map(function(p){var d=p.items.filter(function(i){return i.d}).length,q=p.items.length?Math.round(d*100/p.items.length):0;return '<div style="margin:8px 0"><div class="row sp"><span>'+e(p.n)+'</span><span class="mut">'+q+'%</span></div>'+bar(q)+'</div>'}).join("")+'</div>';
 h+='<h3>Recent activity</h3><div class="card">'+(D.log.length?D.log.slice(0,15).map(function(l){return '<div class="lg">'+e(l.tx)+' <span class="mut">· '+new Date(l.ts).toLocaleString("en-GB",{dateStyle:"short",timeStyle:"short"})+'</span></div>'}).join(""):'<span class="mut">No activity yet</span>')+'</div>';
 return h},
att:function(){
 var h='<h2>Attendance</h2>'+chips();
 if(U.tr<0)return h+'<p class="mut">Pick a team to see its leader and members.</p>';
 var t=TR[U.tr],ms=tm(t),s=ss(t);h+=leadCard(t);
 h+=U.ns?'<div class="card"><div class="b">New session</div><input type="date" id="sd" style="margin:8px 0">'+ms.map(function(m){return '<label class="chk"><input type="checkbox" class="pc" value="'+m.id+'">'+e(m.n)+(m.L?' <span class="tag l">Leader</span>':'')+'</label>'}).join("")+'<div class="row" style="margin-top:10px"><button class="btn" onclick="addS()">Save session</button><button class="btn s" onclick="U.ns=false;R()">Cancel</button></div></div>':'<button class="btn" style="width:100%;margin-bottom:10px" onclick="U.ns=true;R()">＋ Record new session ('+s.length+' so far)</button>';
 return h+ms.map(function(m){var p=pct(m);return '<div class="card"><div class="row sp nw"><div><span class="b">'+e(m.n)+'</span> '+(m.L?'<span class="tag l">Leader</span>':'')+(m.st==="bl"?' <span class="tag r">Blacklisted</span>':(m.w>0?' <span class="tag r">Warning '+m.w+'/3</span>':''))+(m.st==="star"?' <span class="tag f">Featured</span>':'')+'<div class="mut"><a href="mailto:'+e(m.e)+'">'+e(m.e)+'</a> · '+e(m.p)+'</div></div><span class="b" style="font-size:20px">'+(p===null?"—":p+"%")+'</span></div>'+bar(p)+'<div style="margin:8px 0">'+s.map(function(x,i){return '<i class="d '+(x.pres.indexOf(m.id)>-1?"ok":"no")+'" title="'+e(x.d)+'"></i>'}).join("")+'</div><input placeholder="Comments..." value="'+e(m.c)+'" onchange="setC(\''+m.id+'\',this.value)"><div class="row nw" style="margin-top:8px"><button class="gb '+(m.st==="star"?"on":"")+'" onclick="star(\''+m.id+'\')">Featured</button><button class="rb '+(m.st==="bl"||m.w>0?"on":"")+'" onclick="bl(\''+m.id+'\')">'+(m.st==="bl"?"Remove from blacklist":"Send warning ("+(m.w||0)+"/3)")+'</button>'+(m.w>0&&m.st!=="bl"?'<button class="btn s sm" onclick="unw(\''+m.id+'\')">Undo</button>':'')+'</div>'+'</div>'}).join("")},
tasks:function(){
 var h='<h2>Team Tasks</h2>'+chips();
 if(U.tr<0)return h+'<p class="mut">Pick a team. The leader appears on top and the members below, each with their own tasks.</p>';
 var t=TR[U.tr];h+=leadCard(t);
 var mb=tm(t).filter(function(m){return!m.L});
 if(!mb.length)return h+'<p class="mut">No members in this team yet.</p>';
 return h+mb.map(function(m){var ts=D.tasks.filter(function(x){return x.m===m.id});return '<div class="card"><div class="row nw" style="margin-bottom:4px"><div class="av" style="width:34px;height:34px;font-size:13px">'+e(ini(m.n))+'</div><div class="b" style="flex:1">'+e(m.n)+'</div><span class="tag">'+ts.filter(function(k){return k.done}).length+'/'+ts.length+'</span></div>'+(ts.length?'':'<div class="mut" style="padding:6px 0">No tasks assigned yet</div>')+ts.map(function(k){return '<div class="tk"><label class="row nw"><input type="checkbox" style="width:20px;height:20px;flex:none" '+(k.done?"checked":"")+' onchange="tdn(\''+k.id+'\')"><span style="flex:1;'+(k.done?"text-decoration:line-through;opacity:.6":"")+'">'+e(k.n)+'</span>'+(k.due?'<span class="mut">Due '+e(k.due)+'</span>':'')+'<span onclick="event.preventDefault();tdel(\''+k.id+'\')" style="color:var(--bad)">✕</span></label><div>'+[1,2,3,4,5].map(function(n){return '<span class="st '+(n<=k.r?"on":"")+'" onclick="rate(\''+k.id+'\','+n+')">★</span>'}).join("")+'</div><input placeholder="Rating notes / comments..." value="'+e(k.c)+'" onchange="tcm(\''+k.id+'\',this.value)"></div>'}).join("")+'<div class="row nw" style="margin-top:10px"><input id="nt'+m.id+'" placeholder="Assign a new task"><input id="nd'+m.id+'" type="date" style="width:140px;flex:none"><button class="btn sm" onclick="addT(\''+m.id+'\')">＋</button></div></div>'}).join("")},
proj:function(){
 if(U.pj){var p=cp();if(p){var d=p.items.filter(function(i){return i.d}).length,q=p.items.length?Math.round(d*100/p.items.length):0;
 return '<button class="btn s sm" onclick="U.pj=null;R()">← All projects</button><h2 style="margin-top:12px">'+e(p.n)+'</h2><div class="card"><div class="mut">'+e(p.d)+'</div><div class="row sp" style="margin:8px 0"><span>Progress</span><b>'+q+'%</b></div>'+bar(q)+'<input placeholder="Project owner" value="'+e(p.own)+'" style="margin-top:10px" onchange="pf(\'own\',this.value)"></div><h3>Checklist</h3><div class="card">'+p.items.map(function(i,j){return '<label class="chk"><input type="checkbox" '+(i.d?"checked":"")+' onchange="pit('+j+')"><span style="flex:1">'+e(i.x)+'</span><span onclick="event.preventDefault();pdel('+j+')" style="color:var(--bad)">✕</span></label>'}).join("")+'<div class="row nw" style="margin-top:10px"><input id="pi" placeholder="New item"><button class="btn sm" onclick="padd()">＋</button></div></div><h3>Project notes</h3><textarea rows="4" onchange="pf(\'notes\',this.value)">'+e(p.notes)+'</textarea>'}}
 return '<h2>Projects</h2>'+D.projects.map(function(p){var d=p.items.filter(function(i){return i.d}).length,q=p.items.length?Math.round(d*100/p.items.length):0;return '<div class="card pj" onclick="U.pj=\''+p.id+'\';R();scrollTo(0,0)"><div class="row sp"><span class="b" style="font-size:16px">'+e(p.n)+'</span><span class="tag">'+d+'/'+p.items.length+'</span></div><div class="mut" style="margin:4px 0 8px">'+e(p.d)+'</div>'+bar(q)+'</div>'}).join("")}
};
function modal(){var m=mem(U.md),n=(m.w||0)+1,x=msg(m,n);return '<div class="mod"><div class="card" style="max-height:92vh;overflow:auto"><div class="b">'+(n>=3?'Final warning (3 of 3)':'Warning '+n+' of 3')+'</div><div class="mut" style="margin:2px 0 10px">'+(n>=3?'Sending this will move '+e(m.n)+' to the blacklist.':'The message is ready. Edit it if you like, then press Send.')+'</div><div class="mut">To</div><input value="'+e(m.e)+'" readonly><div class="mut" style="margin-top:8px">Subject</div><input id="ms" value="'+e(x.s)+'"><div class="mut" style="margin-top:8px">Message</div><textarea id="mb" rows="13" style="font-size:13px">'+e(x.b)+'</textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="sendW()">Send</button><button class="btn s" onclick="U.md=null;R()">Cancel</button></div></div></div>'}
function msg(m,n){var f=n>=3,en=f?"You have received 3 warnings from ZUFS Racing Team regarding your commitment to the team ("+m.t+"), and your membership has therefore been moved to the team blacklist. Please get in touch with your team leader.":"This is warning "+n+" of 3 from ZUFS Racing Team regarding your commitment to the team ("+m.t+"). Please get in touch with your team leader as soon as possible. After 3 warnings, your membership will be moved to the team blacklist.",ar=f?"لقد وصلت إلى 3 إنذارات من فريق ZUFS Racing Team بخصوص الالتزام بالفريق ("+m.t+")، وبناءً عليه تم نقل عضويتك إلى القائمة السوداء للفريق. برجاء التواصل مع ليدر الفريق.":"هذا هو الإنذار رقم "+n+" من 3 من فريق ZUFS Racing Team بخصوص الالتزام بالفريق ("+m.t+"). برجاء التواصل مع ليدر الفريق في أقرب وقت. بعد 3 إنذارات سيتم نقل عضويتك إلى القائمة السوداء للفريق.";return{s:(f?"Blacklist notice / إشعار القائمة السوداء":"Warning "+n+" of 3 / إنذار "+n+" من 3")+" - ZUFS Racing Team",b:"Hello "+m.n+",\n\n"+en+"\n\nBest regards,\nZUFS Racing Team\n\n--------\n\nمرحبا "+m.n+"،\n\n"+ar+"\n\nمع التحية،\nZUFS Racing Team"}}
function openMail(to,s,b){var a=document.createElement("a");a.href="mailto:"+to+"?subject="+encodeURIComponent(s)+"&body="+encodeURIComponent(b);document.body.appendChild(a);a.click();a.remove()}
function mail(id,n){var m=mem(id),x=msg(m,n||m.w||1);openMail(m.e,x.s,x.b)}
function sendW(){var m=mem(U.md),s=document.getElementById("ms").value,b=document.getElementById("mb").value;m.w=(m.w||0)+1;m.blr="";if(m.w>=3){m.st="bl";log(m.n+" received warning 3/3 and was blacklisted")}else log("Warning "+m.w+"/3 sent to "+m.n);U.md=null;save();openMail(m.e,s,b)}
function bl(id){var m=mem(id);if(m.st==="bl"){m.st="";m.w=0;m.blr="";log("Removed "+m.n+" from the blacklist and cleared warnings");save()}else{U.md=id;R()}}
function unw(id){var m=mem(id);m.w=Math.max(0,(m.w||0)-1);log("Undid last warning for "+m.n);save()}
function star(id){var m=mem(id);if(m.st==="bl")return;m.st=m.st==="star"?"":"star";log((m.st?"Featured ":"Removed featured status from ")+m.n);save()}
function setC(id,v){mem(id).c=v;save()}
function addS(){var p=[].slice.call(document.querySelectorAll(".pc:checked")).map(function(c){return c.value}),d=document.getElementById("sd").value||new Date().toISOString().slice(0,10),t=TR[U.tr];D.sessions.push({id:uid(),t:t,d:d,pres:p});log(t+" session ("+d+"): "+p.length+" of "+tm(t).length+" attended");U.ns=false;save()}
function tk(id){return D.tasks.filter(function(t){return t.id===id})[0]}
function tdn(id){var k=tk(id);k.done=!k.done;log((k.done?"Task done: ":"Task reopened: ")+k.n+" ("+mem(k.m).n+")");save()}
function tdel(id){D.tasks=D.tasks.filter(function(t){return t.id!==id});save()}
function rate(id,n){var k=tk(id);k.r=k.r===n?0:n;log("Rated "+k.r+"/5: "+k.n);save()}
function tcm(id,v){tk(id).c=v;save()}
function addT(mid){var v=document.getElementById("nt"+mid).value.trim();if(!v)return;D.tasks.push({id:uid(),m:mid,n:v,due:document.getElementById("nd"+mid).value,done:false,r:0,c:""});log("New task for "+mem(mid).n+": "+v);save()}
function cp(){return D.projects.filter(function(x){return x.id===U.pj})[0]}
function pit(j){var p=cp(),i=p.items[j];i.d=!i.d;log((i.d?"Completed ":"Reopened ")+i.x+" in "+p.n);save()}
function pdel(j){cp().items.splice(j,1);save()}
function padd(){var v=document.getElementById("pi").value.trim();if(!v)return;cp().items.push({x:v,d:false});log("New item in "+cp().n+": "+v);save()}
function pf(k,v){cp()[k]=v;save()}
